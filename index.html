<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6efe4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17130f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tarjetas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Tarjetas · Spanish Flashcards</title>
<meta name="description" content="Picture flashcards for Spain Spanish vocabulary, grouped by topic.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6efe4; --panel: #fffaf2; --ink: #221a12; --muted: #7a6e60; --line: #e6dccb;
    --accent: #c2462b; --accent-soft: #f5ddd3; --good: #2e7350; --good-soft: #d9ecdf; --chip: #efe6d6;
    --sun: #e3a52b;
    --shadow: 0 1px 0 rgba(0,0,0,.04), 0 18px 40px -22px rgba(90,50,10,.38);
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17130f; --panel: #221c16; --ink: #f1e9dc; --muted: #a39684; --line: #3a3128;
      --accent: #ec7a5c; --accent-soft: #3d241b; --good: #7ccb9d; --good-soft: #1b3326; --chip: #2d251d;
      --shadow: 0 1px 0 rgba(255,255,255,.03), 0 18px 40px -22px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17130f; --panel: #221c16; --ink: #f1e9dc; --muted: #a39684; --line: #3a3128;
    --accent: #ec7a5c; --accent-soft: #3d241b; --good: #7ccb9d; --good-soft: #1b3326; --chip: #2d251d;
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 18px 40px -22px rgba(0,0,0,.8);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Bricolage Grotesque", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .mono { font-variant-numeric: tabular-nums; }

  /* ---------- Study screen (the app opens here) ---------- */
  #study { max-width: 560px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    padding: calc(10px + var(--safe-t)) 16px calc(14px + var(--safe-b)); }
  .bar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .topics-btn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel);
    border-radius: 999px; padding: 7px 14px 7px 10px; font-size: 14px; font-weight: 500; cursor: pointer; max-width: 70%; }
  .topics-btn svg { flex: none; width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .topics-btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topics-btn:active { transform: scale(.97); }
  .count { margin-left: auto; font-size: 14px; color: var(--muted); }
  .progress { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 10px 0 14px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }

  #stage { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .deck { flex: 1; min-height: 0; position: relative; perspective: 1600px; }
  .card { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.7,.2,1); cursor: pointer; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .card.flipped { transform: rotateY(180deg); }
  .card.dragging { transition: none; }
  .card.fly { transition: transform .28s ease-in, opacity .28s ease-in; opacity: 0; }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--panel); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow);
    overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 18px 20px; }
  .face.back { transform: rotateY(180deg); }
  .face::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 70% at 50% 45%, color-mix(in srgb, var(--sun) 14%, transparent), transparent 70%); }
  .tag { position: relative; font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); align-self: stretch; text-align: center; }
  .tag .known { color: var(--good); }
  .pic { position: relative; flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; }
  .pic img { width: min(72%, 300px); max-height: 100%; aspect-ratio: 1; object-fit: contain; filter: drop-shadow(0 18px 18px rgba(80,40,0,.18)); pointer-events: none; -webkit-user-drag: none; }
  .hint { position: relative; font-size: 12px; color: var(--muted); }

  /* back: faded picture with the Spanish word on top */
  .back .pic img { opacity: .16; width: min(92%, 380px); filter: saturate(.9) blur(.5px); }
  .word { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 8px; }
  .es { font-family: Fraunces, Georgia, serif; font-weight: 650; font-size: clamp(36px, 11vw, 60px); line-height: 1.05; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .es.long { font-size: clamp(30px, 8.5vw, 46px); }
  .es .art { display: block; font-weight: 400; font-style: italic; font-size: .5em; color: var(--accent); letter-spacing: 0; margin-bottom: 2px; }
  .en { margin-top: 12px; font-size: 16px; color: var(--muted); }
  .say { position: absolute; right: 16px; bottom: 14px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); display: grid; place-items: center; cursor: pointer; z-index: 4; }
  .say svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .say:active { transform: scale(.94); }

  .stamp { position: absolute; top: 54px; padding: 4px 10px; border-radius: 8px; background: var(--panel); font-weight: 600; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; opacity: 0; pointer-events: none; z-index: 3; }
  .stamp.got { left: 18px; color: var(--good); border: 2px solid var(--good); transform: rotate(-8deg); }
  .stamp.again { right: 18px; color: var(--accent); border: 2px solid var(--accent); transform: rotate(8deg); }

  .actions { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; margin-top: 14px; }
  .act { border: 0; border-radius: 18px; padding: 16px 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform .08s; }
  .act:active { transform: scale(.96); }
  .act.again { background: var(--accent-soft); color: var(--accent); }
  .act.got { background: var(--good-soft); color: var(--good); }
  .act.skip { background: var(--panel); border: 1px solid var(--line); color: var(--muted); padding: 16px 18px; font-weight: 500; }
  .swipe-hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }

  .done { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
  .done img { width: 120px; height: 120px; margin-bottom: 14px; }
  .done h2 { font-family: Fraunces, Georgia, serif; font-weight: 650; font-size: 34px; margin: 0 0 6px; }
  .done p { color: var(--muted); margin: 0 0 26px; }
  .big { width: 100%; max-width: 320px; border: 0; border-radius: 18px; background: var(--ink); color: var(--bg); padding: 17px 20px; font-size: 17px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); margin-bottom: 10px; }
  .big:active { transform: scale(.985); }
  .big:disabled { opacity: .35; cursor: not-allowed; }
  .pill { border: 1px solid var(--line); background: var(--panel); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .pill:active { transform: scale(.97); }

  /* ---------- Topics / settings sheet ---------- */
  #settings { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
    animation: up .28s cubic-bezier(.2,.7,.2,1); }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } }
  .sheet { max-width: 560px; margin: 0 auto; padding: calc(16px + var(--safe-t)) 16px calc(110px + var(--safe-b)); }
  .sheet-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 650; font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -.015em; }
  h1 small { display: block; font: 500 12px "Bricolage Grotesque", sans-serif; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
  .icon-btn { flex: none; margin-left: auto; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; cursor: pointer; }
  .icon-btn + .icon-btn { margin-left: 0; }
  .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .quick { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; }
  .quick .pill { padding: 8px 16px; }
  .sec { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 4px 8px; margin-top: 22px; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .topic { display: grid; grid-template-columns: 26px 40px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; min-height: 60px; cursor: pointer; user-select: none; border-top: 1px solid var(--line); }
  .topic:first-child { border-top: 0; }
  .topic:active { background: var(--chip); }
  .topic img { width: 40px; height: 40px; }
  .box { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--muted); display: grid; place-items: center; transition: background .15s, border-color .15s; }
  .topic.on .box { background: var(--accent); border-color: var(--accent); }
  .topic.on .box::after { content: ""; width: 10px; height: 6px; border: 2.2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
  .topic.some .box { border-color: var(--accent); }
  .topic.some .box::after { content: ""; width: 10px; height: 2.2px; border-radius: 2px; background: var(--accent); }
  .topic.sub { padding-left: 52px; grid-template-columns: 24px 32px 1fr auto; min-height: 52px; border-top-style: dashed; }
  .topic.sub img { width: 32px; height: 32px; }
  .topic.sub .box { width: 22px; height: 22px; }
  .topic.sub .t-name { font-size: 15px; }
  .topic.sub .t-name small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topic.sub .t-name { min-width: 0; }
  .t-name { font-size: 16px; font-weight: 500; line-height: 1.25; }
  .t-name small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .meter { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .meter i { display: block; width: 44px; height: 3px; background: var(--line); border-radius: 9px; margin-top: 5px; overflow: hidden; margin-left: auto; }
  .meter i b { display: block; height: 100%; background: var(--good); }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px; border-top: 1px solid var(--line); cursor: pointer; user-select: none; }
  .opt:first-child { border-top: 0; }
  .opt-txt { font-size: 15px; }
  .opt-txt small { display: block; font-size: 13px; color: var(--muted); }
  .switch { flex: none; width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .opt.on .switch { background: var(--accent); }
  .opt.on .switch::after { transform: translateX(18px); }
  .reset { display: block; margin: 22px auto 0; background: none; border: 0; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px; }
  .note { text-align: center; font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .note a { color: inherit; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(14px + var(--safe-b)); background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 21; }
  .dock .big { max-width: 528px; display: flex; justify-content: space-between; align-items: center; margin: 0 auto; }
  .dock .big span { font-weight: 400; font-size: 14px; opacity: .75; }

  @media (min-width: 700px) {
    #study { max-height: 900px; }
    h1 { font-size: 36px; }
  }
  @media (prefers-reduced-motion: reduce) { .card, .card.fly { transition: none; } #settings { animation: none; } }
</style>
</head>
<body>

<!-- Flashcards: the app opens straight here -->
<section id="study">
  <div class="bar">
    <button class="topics-btn" id="topicsBtn" aria-label="Choose topics and settings">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/><circle cx="18" cy="16" r="3"/></svg>
      <span id="topicsLabel">Topics</span>
    </button>
    <span class="count mono" id="count"></span>
  </div>
  <div class="progress"><div id="progress"></div></div>
  <div id="stage"></div>
</section>

<!-- Topics + settings (opens over the cards) -->
<section id="settings" hidden>
  <div class="sheet">
    <div class="sheet-top">
      <h1><small>Español de España</small>Topics</h1>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle light/dark theme">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <div class="quick">
      <button class="pill" id="allBtn">Select all</button>
      <button class="pill" id="noneBtn">Clear</button>
      <button class="pill" id="installBtn" hidden style="margin-left:auto;color:var(--accent)">Install app</button>
    </div>
    <div class="group" id="topicList"></div>

    <div class="sec">Options</div>
    <div class="group">
      <div class="opt" data-opt="dueOnly"><div class="opt-txt">Unlearned only<small>Hide words you've marked "Got it"</small></div><div class="switch"></div></div>
      <div class="opt" data-opt="autoSay"><div class="opt-txt">Say the word when flipped<small>Uses your phone's Spanish (Spain) voice</small></div><div class="switch"></div></div>
      <div class="opt" data-opt="showEn"><div class="opt-txt">Show English on the back<small>Small translation under the Spanish</small></div><div class="switch"></div></div>
    </div>
    <button class="reset" id="resetBtn">Reset learned progress</button>
    <p class="note">Progress is saved on this device.</p>
    <p class="note">Pictures: <a href="https://github.com/microsoft/fluentui-emoji" target="_blank" rel="noopener">Microsoft Fluent Emoji</a> (MIT licence).</p>
  </div>
  <div class="dock"><button class="big" id="doneBtn"><b>Back to cards</b><span id="doneCount"></span></button></div>
</section>

<script src="cards.js"></script>
<script>
(function () {
  // Big topics are split into evenly sized groups of 7-9 words (e.g. 25 words -> 9 + 8 + 8).
  // If a size can't be split without dropping under 7, it keeps fewer, larger groups instead.
  const MAX = 9, MIN = 7;
  const TOPICS = window.TOPICS || [];
  function split(t) {
    const n = t.cards.length;
    let k = Math.ceil(n / MAX);
    while (k > 1 && Math.floor(n / k) < MIN) k--;
    if (k === 1) return [{ ...t, parent: t, part: 0, of: 1 }];
    const base = Math.floor(n / k), extra = n % k, out = [];
    for (let i = 0, at = 0; i < k; i++) {
      const size = base + (i < extra ? 1 : 0);
      const cards = t.cards.slice(at, at += size);
      out.push({ ...t, id: `${t.id}-${i + 1}`, es: `${t.es} ${i + 1}`, img: cards[0].img, cards, parent: t, part: i + 1, of: k });
    }
    return out;
  }
  const T = TOPICS.flatMap(split);   // the groups you pick from
  const ALL = T.flatMap(t => t.cards.map(c => ({ ...c, id: c.img, topic: t })));
  const KEY = "tarjetas-v1";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const saved = load();
  // A saved whole-topic id (from before groups, or after a regroup) selects all of that topic's groups.
  const ids = new Set(T.map(t => t.id));
  const restore = list => list.flatMap(id => ids.has(id) ? [id] : T.filter(g => g.parent.id === id).map(g => g.id));
  const S = {
    selected: new Set(saved.selected ? restore(saved.selected) : T.map(t => t.id)),   // first launch: every group on
    known: new Set(saved.known || []),
    dueOnly: !!saved.dueOnly, autoSay: saved.autoSay !== false, showEn: saved.showEn !== false,
    theme: saved.theme || null,
    deck: [], i: 0, flipped: false, seen: 0, got: 0, again: 0
  };
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({
    selected: [...S.selected], known: [...S.known], dueOnly: S.dueOnly, autoSay: S.autoSay, showEn: S.showEn, theme: S.theme
  })); } catch (e) {} };
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const img = name => `images/${name}.webp`;
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

  /* ---------- theme ---------- */
  const applyTheme = () => S.theme ? document.documentElement.setAttribute("data-theme", S.theme) : document.documentElement.removeAttribute("data-theme");
  $("themeBtn").onclick = () => {
    const dark = S.theme ? S.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    S.theme = dark ? "light" : "dark"; applyTheme(); persist();
  };
  applyTheme();

  /* ---------- speech (built-in Spanish voice, works offline) ---------- */
  const canSay = "speechSynthesis" in window;
  let esVoice = null;
  const pickVoice = () => {
    const v = canSay ? speechSynthesis.getVoices() : [];
    esVoice = v.find(x => x.lang === "es-ES" && x.localService) || v.find(x => x.lang === "es-ES") || v.find(x => /^es[-_]ES/i.test(x.lang)) || v.find(x => /^es/i.test(x.lang)) || null;
  };
  if (canSay) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(text) {
    if (!canSay) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[¡!¿?]/g, ""));
    u.lang = "es-ES"; if (esVoice) u.voice = esVoice; u.rate = 0.9;
    speechSynthesis.speak(u);
  }

  /* ---------- deck ---------- */
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pool = () => ALL.filter(c => S.selected.has(c.topic.id));
  function build() {
    const p = pool();
    const fresh = shuffle(p.filter(c => !S.known.has(c.id)));
    const learned = S.dueOnly ? [] : shuffle(p.filter(c => S.known.has(c.id)));
    Object.assign(S, { deck: fresh.concat(learned), i: 0, flipped: false, seen: 0, got: 0, again: 0 });
    renderTopBar(); renderStudy();
  }
  function renderTopBar() {
    const n = S.selected.size;
    const on = T.filter(t => S.selected.has(t.id)), parents = new Set(on.map(t => t.parent));
    const whole = on.length === (on[0] && on[0].of);
    $("topicsLabel").textContent = n === 0 ? "Pick topics" : n === T.length ? "All topics" :
      n === 1 ? on[0].es : parents.size === 1 && whole ? on[0].parent.es :
      parents.size === 1 ? `${on[0].parent.es} · ${n} groups` : `${parents.size} topics`;
  }

  /* ---------- card screen ---------- */
  function splitArticle(es) {
    const m = es.match(/^(el|la|los|las)\s+(.+)$/i);
    return m ? `<span class="art">${esc(m[1])}</span>${esc(m[2])}` : esc(es);
  }
  function renderStudy() {
    const left = S.deck.length - S.i;
    $("progress").style.width = (S.seen + left) ? (100 * S.seen / (S.seen + left)) + "%" : "0%";
    $("count").textContent = left > 0 ? `${S.i + 1} / ${S.deck.length}` : "";
    const stage = $("stage");
    if (left <= 0) {
      const none = S.selected.size === 0, allKnown = !none && S.deck.length === 0;
      stage.innerHTML = `<div class="done">
          <img src="${img(none ? "books" : allKnown ? "trophy" : "party-popper")}" alt="">
          <h2>${none ? "No topics" : allKnown ? "¡Todo aprendido!" : "¡Muy bien!"}</h2>
          <p>${none ? "Choose at least one topic to study." : allKnown ? "You've learned every word in these topics." : `${S.got} got it · ${S.again} needed another look`}</p>
          ${none ? "" : `<button class="big" id="goAgain">${allKnown ? "Review them all" : "Go again"}</button>`}
          <button class="pill" id="goTopics">Change topics</button></div>`;
      if ($("goAgain")) $("goAgain").onclick = () => { if (allKnown && S.dueOnly) { S.dueOnly = false; persist(); } build(); };
      $("goTopics").onclick = openSettings;
      return;
    }
    const c = S.deck[S.i];
    const long = c.es.replace(/^(el|la|los|las)\s+/i, "").length > 11;
    const tag = `<div class="tag">${esc(c.topic.es)}${S.known.has(c.id) ? ' · <span class="known">✓ learned</span>' : ""}</div>`;
    const stamps = `<span class="stamp got">Got it</span><span class="stamp again">Again</span>`;
    stage.innerHTML = `
      <div class="deck">
        <div class="card${S.flipped ? " flipped" : ""}" id="card" aria-live="polite">
          <div class="face front">${stamps}${tag}
            <div class="pic"><img src="${img(c.img)}" alt="What is this in Spanish?" draggable="false"></div>
            <div class="hint">Tap to see the word</div></div>
          <div class="face back">${stamps}${tag}
            <div class="pic"><img src="${img(c.img)}" alt="" draggable="false">
              <div class="word"><div class="es${long ? " long" : ""}" lang="es">${splitArticle(c.es)}</div>${S.showEn ? `<div class="en">${esc(c.en)}</div>` : ""}</div>
            </div>
            <div class="hint">Tap to flip back</div>
            ${canSay ? `<button class="say" id="sayBtn" aria-label="Say it"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>` : ""}
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="act again" id="aBtn">Again</button>
        <button class="act skip" id="sBtn">Skip</button>
        <button class="act got" id="gBtn">Got it</button>
      </div>
      <div class="swipe-hint">Swipe → got it · ← again</div>`;
    $("aBtn").onclick = () => advance("again");
    $("gBtn").onclick = () => advance("got");
    $("sBtn").onclick = () => advance("skip");
    if ($("sayBtn")) {
      $("sayBtn").addEventListener("pointerdown", e => e.stopPropagation());
      $("sayBtn").onclick = e => { e.stopPropagation(); say(c.es); };
    }
    attachSwipe($("card"));
    const nx = S.deck[S.i + 1]; if (nx) new Image().src = img(nx.img);   // preload the next picture
  }
  function flip() {
    S.flipped = !S.flipped; $("card").classList.toggle("flipped", S.flipped);
    if (S.flipped && S.autoSay) say(S.deck[S.i].es);
  }

  let busy = false;
  function advance(kind, flyDir) {
    const c = S.deck[S.i]; if (!c || busy) return;
    if (kind === "got") { S.known.add(c.id); S.got++; }
    if (kind === "again") {
      S.known.delete(c.id); S.again++;
      const pos = Math.min(S.deck.length, S.i + 4 + Math.floor(Math.random() * 4));
      S.deck.splice(pos, 0, c);
    }
    persist();
    const card = $("card");
    const dir = flyDir || (kind === "got" ? 1 : kind === "again" ? -1 : 0);
    const go = () => { S.i++; S.seen++; S.flipped = false; busy = false; renderStudy(); };
    if (dir && card && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      busy = true;
      card.classList.remove("dragging"); card.classList.add("fly");
      card.style.transform = `translateX(${dir * 120}%) rotate(${dir * 14}deg) rotateY(${S.flipped ? 180 : 0}deg)`;
      setTimeout(go, 260);
    } else go();
  }

  function attachSwipe(card) {
    let x0 = 0, y0 = 0, dx = 0, active = false, horiz = null;
    const stamps = () => card.querySelectorAll(S.flipped ? ".back .stamp" : ".front .stamp");
    const setStamp = v => stamps().forEach(s => {
      const isGot = s.classList.contains("got");
      s.style.opacity = isGot ? Math.max(0, Math.min(1, v / 90)) : Math.max(0, Math.min(1, -v / 90));
    });
    card.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      active = true; horiz = null; x0 = e.clientX; y0 = e.clientY; dx = 0;
    });
    card.addEventListener("pointermove", e => {
      if (!active) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (horiz === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) {
        horiz = Math.abs(mx) > Math.abs(my);
        if (horiz) { card.setPointerCapture(e.pointerId); card.classList.add("dragging"); }
      }
      if (!horiz) return;
      dx = mx;
      card.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg) rotateY(${S.flipped ? 180 : 0}deg)`;
      setStamp(dx);
    });
    const end = () => {
      if (!active) return; active = false;
      if (horiz) {
        card.classList.remove("dragging");
        if (Math.abs(dx) > Math.min(110, card.offsetWidth * 0.28)) { advance(dx > 0 ? "got" : "again", Math.sign(dx)); return; }
        card.style.transform = ""; setStamp(0);
      } else if (horiz === null) {
        flip(); // a tap
      }
    };
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", () => { active = false; card.classList.remove("dragging"); card.style.transform = ""; setStamp(0); });
  }

  /* ---------- topics + settings sheet ---------- */
  let snapshot = "";
  const stateKey = () => [...S.selected].sort().join(",") + "|" + S.dueOnly;
  function renderSettings() {
    const list = $("topicList"); list.innerHTML = "";
    const addRow = (cls, picture, name, sub, cards, groups) => {
      const k = cards.filter(c => S.known.has(c.img)).length;
      const n = groups.filter(g => S.selected.has(g.id)).length;
      const on = n === groups.length, some = n > 0 && !on;
      const row = document.createElement("div");
      row.className = cls + (on ? " on" : some ? " some" : "");
      row.setAttribute("role", "checkbox"); row.setAttribute("aria-checked", on ? "true" : some ? "mixed" : "false"); row.tabIndex = 0;
      row.innerHTML = `<span class="box"></span><img src="${img(picture)}" alt="" loading="lazy">
        <span class="t-name">${name}<small lang="en">${esc(sub)}</small></span>
        <span class="meter mono">${k}/${cards.length}<i><b style="width:${100 * k / cards.length}%"></b></i></span>`;
      const toggle = () => { groups.forEach(g => on ? S.selected.delete(g.id) : S.selected.add(g.id)); persist(); renderSettings(); };
      row.onclick = toggle;
      row.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); } };
      list.appendChild(row);
    };
    TOPICS.forEach(p => {
      const groups = T.filter(g => g.parent === p);
      addRow("topic", p.img, `<span lang="es">${esc(p.es)}</span>`, groups.length > 1 ? `${p.en} · ${groups.length} groups` : p.en, p.cards, groups);
      if (groups.length > 1) groups.forEach(g =>
        addRow("topic sub", g.img, `<span lang="es">Grupo ${g.part}</span>`, g.cards.slice(0, 3).map(c => c.en).join(", ") + "…", g.cards, [g]));
    });
    document.querySelectorAll(".opt").forEach(o => o.classList.toggle("on", !!S[o.dataset.opt]));
    if (!canSay) document.querySelector('[data-opt="autoSay"]').hidden = true;
    const p = pool(), n = S.dueOnly ? p.filter(c => !S.known.has(c.id)).length : p.length;
    $("doneCount").textContent = S.selected.size ? plural(n, "word") : "pick a topic";
    $("doneBtn").disabled = S.selected.size === 0;
  }
  document.querySelectorAll(".opt").forEach(o => o.onclick = () => { S[o.dataset.opt] = !S[o.dataset.opt]; persist(); renderSettings(); });
  $("allBtn").onclick = () => { T.forEach(t => S.selected.add(t.id)); persist(); renderSettings(); };
  $("noneBtn").onclick = () => { S.selected.clear(); persist(); renderSettings(); };
  $("resetBtn").onclick = () => { if (confirm("Clear all 'Got it' progress?")) { S.known.clear(); persist(); renderSettings(); snapshot = ""; } };

  // The sheet uses browser history, so the phone's back button closes it.
  function openSettings() {
    snapshot = stateKey(); renderSettings();
    $("settings").hidden = false; $("settings").scrollTop = 0;
    history.pushState({ v: "settings" }, "", "#topics");
  }
  function closedSettings() {
    $("settings").hidden = true;
    renderTopBar();
    if (stateKey() !== snapshot) build(); else renderStudy();
  }
  $("topicsBtn").onclick = openSettings;
  $("doneBtn").onclick = () => { history.state && history.state.v === "settings" ? history.back() : closedSettings(); };
  addEventListener("popstate", () => { if (!$("settings").hidden) closedSettings(); });
  if (location.hash) history.replaceState(null, "", location.pathname);

  addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!$("settings").hidden) { if (e.key === "Escape") $("doneBtn").click(); return; }
    const k = e.key.toLowerCase();
    if (k === " ") { e.preventDefault(); if ($("card")) flip(); }
    else if (k === "arrowright" || k === "g") advance("got");
    else if (k === "arrowleft" || k === "a") advance("again");
    else if (k === "s") advance("skip");
    else if (k === "p" && S.deck[S.i]) say(S.deck[S.i].es);
    else if (k === "t") openSettings();
  });

  build();

  /* ---------- PWA: offline support + install button (Android/desktop Chrome) ---------- */
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
  let installEvt = null;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("installBtn").hidden = false; });
  $("installBtn").onclick = async () => {
    if (!installEvt) return;
    installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("installBtn").hidden = true;
  };
  addEventListener("appinstalled", () => { $("installBtn").hidden = true; });
})();
</script>
</body>
</html>
